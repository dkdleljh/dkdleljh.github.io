name: Sync catalog and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-catalog
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test catalog boundaries
        run: python -m unittest discover -s tests -v
      - name: Refresh public repository metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python .github/scripts/update_repos.py
      - name: Commit catalog changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _data/projects.json index.md links.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: refresh project descriptions and releases'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - uses: actions/upload-pages-artifact@v4
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
